name: GSO Gate

on:
  workflow_dispatch:
    inputs:
      update_visual_baseline:
        description: Generate a candidate visual baseline artifact for review
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    runs-on: self-hosted
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          node -v
          npm -v
          pwd
          ls -la

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dependency boundary gate
        run: |
          mkdir -p dependency-cruiser-report
          npm run test:dependencies 2>&1 | tee dependency-cruiser-report/report.txt

      - name: Knip unused code and dependency gate
        run: |
          mkdir -p knip-report
          set +e
          npm run test:unused > knip-report/report.txt 2>&1
          knip_status=$?
          npx knip --reporter json > knip-report/report.json 2>&1 || true
          npx knip --reporter markdown > knip-report/report.md 2>&1 || true
          npx knip --version > knip-report/version.txt
          cat knip-report/report.txt
          exit "$knip_status"

      - name: Install Playwright Chromium
        # The self-hosted runner account is intentionally non-root. System
        # dependencies are managed on the host; the workflow only downloads
        # the pinned Playwright browser into the runner cache.
        run: npx playwright install chromium

      - name: Playwright smoke test
        run: npm run test:smoke

      - name: Generate candidate BackstopJS visual baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baseline
        run: npm run test:visual:reference

      - name: BackstopJS visual baseline gate
        if: github.event_name != 'workflow_dispatch' || !inputs.update_visual_baseline
        run: npm run test:visual

      - name: axe-core accessibility gate
        run: npm run test:accessibility

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstop-visual-${{ github.run_id }}
          path: |
            backstop_data/bitmaps_reference/
            backstop_data/bitmaps_test/
            backstop_data/html_report/
            backstop_data/ci_report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload dependency boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-cruiser-${{ github.run_id }}
          path: dependency-cruiser-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Knip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-unused-${{ github.run_id }}
          path: knip-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload axe-core accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-accessibility-${{ github.run_id }}
          path: axe-report/
          if-no-files-found: warn
          retention-days: 7
