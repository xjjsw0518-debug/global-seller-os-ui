name: GSO Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          node -v
          npm -v
          pwd
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build